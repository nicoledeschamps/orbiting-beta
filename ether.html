<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>The Ether · Orbit</title>
  <meta name="description" content="drift into the ether: public art, space and orbit's picks, floating past. no account needed.">
  <meta property="og:title" content="The Ether · Orbit">
  <meta property="og:description" content="drift into the ether. no account needed.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1FA90;</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Climate+Crisis&family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <!-- The app's own Wander and Ether styles, then this page's (guest-ether.css) last. -->
  <link rel="stylesheet" href="css/orbiting-prototype.css?v=20261028-brand">
  <link rel="stylesheet" href="css/orbit-plate.css?v=20261022-ether-offer">
  <link rel="stylesheet" href="css/wander-dock.css?v=20261028-guest">
  <link rel="stylesheet" href="css/tune-row.css?v=20261028-guest">
  <link rel="stylesheet" href="css/ether.css?v=20261028-guest">
  <link rel="stylesheet" href="css/guest-ether.css?v=20261029-signin">
</head>
<!-- The Ether for visitors without an account: open collections and Orbiting's picks only. No account code is loaded,
     so other people's orbits can't reach this page. "request an invite" leads to the welcome page's invite sheet.
     Shapes: drift, horizon (ether-drift.js) and planet (explore-planet.js, the same planet as in the app). -->
<body class="is-ether is-explore is-guest-ether">
  <header class="guest-top">
    <a class="guest-top__wordmark" href="welcome.html">Orbit</a>
    <nav>
      <a class="guest-top__quiet" href="login.html?signin">sign in</a>
      <a class="guest-top__request" href="welcome.html#invite">request an invite</a>
    </nav>
  </header>

  <main class="explore-layer is-active" id="exploreLayer" aria-labelledby="exploreTitle">
    <div class="explore-layer__heading">
      <h1 id="exploreTitle">The Ether<span>.</span></h1>
      <p class="guest-about" id="guestAbout">tap anything that pulls you in.</p>
      <button class="wander-pill ether-tuned" id="etherTuned" type="button" aria-pressed="true" hidden></button>
    </div>

    <div class="ether-drift" id="etherDrift" role="region" aria-label="The Ether: images drifting at different depths" hidden>
      <div class="ether-drift__scenery" id="etherDriftScenery" aria-hidden="true"></div>
      <div class="ether-drift__items" id="etherDriftItems"></div>
      <aside class="ether-drift__card" id="etherDriftCard" aria-label="Image from the Ether" hidden>
        <img class="ether-drift__thumb" id="etherDriftImage" alt="">
        <div class="ether-drift__text">
          <strong id="etherDriftTitle"></strong>
          <span id="etherDriftSource"></span>
          <div class="ether-drift__actions">
            <button class="ether-drift__add" id="etherDriftAdd" type="button" data-label="request an invite">request an invite</button>
            <button class="ether-drift__orbit" id="etherDriftOrbit" type="button" hidden></button>
            <a class="ether-drift__link" id="etherDriftLink" href="#" target="_blank" rel="noopener noreferrer" hidden>open source ↗</a>
          </div>
        </div>
        <button class="ether-drift__close" id="etherDriftClose" type="button" aria-label="Close">×</button>
      </aside>
    </div>

    <div class="explore-stage">
      <div class="explore-planet" id="explorePlanet" aria-label="A turning planet of images from the Ether">
        <div class="explore-planet__items" id="explorePlanetItems"></div>
      </div>

      <div class="wander-panel wander-filters ether-tune" id="etherTune" role="region" aria-label="Tune the Ether" hidden>
        <form class="ether-tune__form" id="etherTuneForm"><label class="wander-filters__search"><span class="sr-only">Tune the Ether</span><input id="etherTuneSearch" type="search" placeholder="tune the Ether: a word, an artist, a year…" autocomplete="off" spellcheck="false" maxlength="60" enterkeyhint="search"></label></form>
        <div class="tune-try" id="etherTuneTry" role="group" aria-label="Words to try"><span class="tune-try__label">try</span><button type="button" data-word="fashion">fashion</button><button type="button" data-word="light">light</button><button type="button" data-word="interiors">interiors</button><button type="button" data-word="shrines">shrines</button><button type="button" data-word="flowers">flowers</button><button type="button" data-word="portraits">portraits</button></div>
        <div class="tune-row" id="etherTuneRow" aria-label="Tune options"></div>
        <div class="tune-row__detail" id="etherTuneDetail" hidden></div>
      </div>
      <div class="wander-panel wander-controls" id="wanderControls" role="region" aria-label="Shape of the Ether" hidden>
        <div class="ether-shape" id="etherShape" role="group" aria-label="Shape of the Ether"><p class="wander-panel__label">shape</p><div class="wander-filters__row"><button class="wander-pill" type="button" data-shape="drift" aria-pressed="true">drift</button><button class="wander-pill" type="button" data-shape="horizon" aria-pressed="false">horizon</button><button class="wander-pill" type="button" data-shape="planet" aria-pressed="false">planet</button></div></div>
      </div>

      <p class="guest-status" id="guestStatus" role="status" aria-live="polite">drifting in…</p>

      <nav class="wander-dock" aria-label="Ether tools">
        <button class="wander-dock__button wander-filter-toggle" id="etherTuneToggle" type="button" aria-expanded="false" aria-controls="etherTune"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span class="wander-dock__label">tune</span></button>
        <button class="wander-dock__button" id="adjustPlanet" type="button" aria-expanded="false" aria-controls="wanderControls"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><ellipse cx="12" cy="12" rx="10" ry="3.5" transform="rotate(-20 12 12)"/></svg><span class="wander-dock__label">shape</span></button>
        <button class="wander-dock__button ether-back" id="etherBack" type="button" aria-label="Drift back to images you passed"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6M6 20l6-6 6 6"/></svg><span class="wander-dock__label">back</span></button>
        <button class="wander-dock__button ether-deeper" id="etherDeeper" type="button" aria-label="Drift deeper into the Ether"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6M6 4l6 6 6-6"/></svg><span class="wander-dock__label">deeper</span></button>
      </nav>
    </div>

    <!-- explore-planet.js writes its empty-planet note here; this page says so in its own status line instead. -->
    <p class="explore-layer__empty" id="wanderEmpty" hidden></p>
    <!-- The planet's enlarged image, as in the app; "Add to my Orbit" asks for an invite here. -->
    <aside class="explore-detail" id="exploreDetail" role="dialog" aria-modal="true" aria-label="Image from the Ether" hidden>
      <div class="explore-detail__card">
        <div class="explore-detail__frame"><img class="explore-detail__image" id="exploreDetailImage" alt="" draggable="false"><video class="explore-detail__video" id="exploreDetailVideo" muted loop playsinline preload="none" hidden></video><button class="explore-detail__sound" id="exploreDetailSound" type="button" hidden>sound on</button><button class="explore-detail__close" id="exploreDetailClose" type="button" aria-label="Close enlarged image">×</button></div>
        <div class="explore-detail__caption">
          <p class="explore-detail__layer" id="exploreDetailLayer"></p>
          <strong id="exploreDetailTitle"></strong>
          <span id="exploreDetailSource"></span>
          <div class="song-preview" id="exploreSongPreview" hidden></div>
          <div class="explore-detail__nav"><button id="exploreDetailPrev" type="button" aria-label="Previous image">←</button><span>swipe along this layer · double-tap to zoom</span><button class="explore-detail__zoom" id="exploreDetailZoomOut" type="button" aria-label="Zoom out" hidden>⊖</button><button class="explore-detail__zoom" id="exploreDetailZoom" type="button" aria-label="Zoom in">⊕</button><button id="exploreDetailNext" type="button" aria-label="Next image">→</button></div>
          <div class="explore-detail__actions">
            <button id="exploreAddToOrbit" type="button">request an invite</button>
            <button id="exploreEnterFriend" type="button" hidden></button>
            <a id="exploreSourceLink" href="#" target="_blank" rel="noopener noreferrer">open source ↗</a>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" crossorigin="anonymous"></script>
  <script src="js/image-thumbs.js?v=20261022-youtube"></script>
  <script src="js/image-color.js?v=20261026-words"></script>
  <script src="js/tune-row.js?v=20261022-color"></script>
  <script src="js/explore-planet.js?v=20261028-brand"></script>
  <script src="js/ether-sources.js?v=20261029-every-image"></script>
  <script src="js/ether-drift.js?v=20261028-brand"></script>
  <script src="js/guest-ether.js?v=20261028-shapes"></script>
</body>
</html>
