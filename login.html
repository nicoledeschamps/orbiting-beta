<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Orbit · what orbits you?</title>
  <!-- Sign-in lives on the film page now; this address stays so old links and the app's redirects still land somewhere. -->
  <script>
    (() => {
      let signin = new URLSearchParams(location.search).has('signin');
      try { signin ||= localStorage.getItem('orbit-returning') === '1'; } catch (_) { /* Private mode: show the film. */ }
      location.replace(signin ? 'welcome.html?signin' : 'welcome.html');
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=welcome.html"></noscript>
  <style>html, body { margin: 0; background: #000; }</style>
</head>
<body>
  <noscript><a href="welcome.html" style="color:#edf1f4">continue to orbit</a></noscript>
</body>
</html>
