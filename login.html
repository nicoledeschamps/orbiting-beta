<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Log in · Orbiting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Climate+Crisis&family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/orbit-plate.css?v=20261004-plate-c">
  <link rel="stylesheet" href="css/login.css?v=20261004-plate-c">
</head>
<body class="op-sky">
  <div class="login-frame op-frame">
    <header class="login-header">
      <p class="login-wordmark" aria-label="Orbiting"><span>Orbit</span><span>ing</span></p>
      <span class="login-tagline">what orbits you</span>
      <p class="new-account" id="newAccount" hidden>New here? <a href="./?view=setup">Create your orbit</a></p>
    </header>
    <main class="login-shell">
      <div class="orbit-art" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <section class="login-card" aria-labelledby="loginTitle">
        <p class="op-eyebrow">Log in</p>
        <h1 id="loginTitle" class="op-title">Return to your orbit.</h1>
        <p class="intro">Your space. Your people. Everything that orbits you.</p>
        <form id="loginForm">
          <label class="op-field" for="loginEmail">Email address</label>
          <input class="op-input" id="loginEmail" name="email" type="email" autocomplete="username" placeholder="you@example.com" required>
          <div class="password-label"><label for="loginPassword">Password</label><button class="op-link" id="togglePassword" type="button" aria-controls="loginPassword" aria-pressed="false">Show</button></div>
          <input class="op-input" id="loginPassword" name="password" type="password" autocomplete="current-password" required>
          <button class="op-link text-action" id="forgotPassword" type="button">Forgot your password?</button>
          <p id="loginStatus" role="status" aria-live="polite"></p>
          <button class="op-btn primary" id="loginSubmit" type="submit">Log in</button>
        </form>
        <p class="op-hint invite-note" id="inviteNote">Invited to the beta? Use your personal setup link to choose a password first.</p>
      </section>
    </main>
  </div>
  <script src="js/orbiting-account.js?v=20261005-instagram"></script>
  <script src="js/login.js?v=20261004-pages"></script>
</body>
</html>
